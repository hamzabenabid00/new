# ============================================================================
#  Two containers that cooperate to run your Celio tests:
#
#   firefox   →  official Selenium image: Firefox + GeckoDriver + Selenium
#                Grid server. Nothing to build, just pulled from Docker Hub.
#
#   tests     →  YOUR code. Built from ./Dockerfile. Connects to the firefox
#                container over the Docker network via SELENIUM_URL.
#
#  Run everything with:
#     docker compose up --abort-on-container-exit --exit-code-from tests
#  (the flags stop the browser when the tests finish and forward the
#  pass/fail exit code so your terminal shows red/green correctly.)
# ============================================================================

services:

  # ── The browser + Selenium Grid ────────────────────────────────────────
  firefox:
    image: selenium/standalone-firefox:latest
    container_name: celio-firefox
    ports:
      - "4444:4444"   # Selenium Grid endpoint — tests talk to this
      - "7900:7900"   # noVNC web viewer — open http://localhost:7900 to
                      # watch Firefox click through the site live (password: secret)
    # *** #1 Selenium-in-Docker gotcha ***
    # Firefox needs more shared memory than the default 64 MB, otherwise it
    # crashes randomly with "session not created" / "tab crashed". Give it 2 GB.
    shm_size: 2g
    restart: "no"

  # ── Your Maven/Cucumber test runner ────────────────────────────────────
  tests:
    build: .            # build this service from ./Dockerfile
    container_name: celio-tests
    depends_on:
      - firefox         # start the browser before the tests
    environment:
      # Docker has a built-in DNS. The service name "firefox" resolves to
      # the browser container's IP, so the test container can reach it.
      # Config.java does: System.getenv().getOrDefault("SELENIUM_URL", ...)
      SELENIUM_URL: "http://firefox:4444"
    # Mount the host ./target folder into the container's /app/target so the
    # Cucumber HTML report (target/cucumber-report.html) survives after the
    # container exits. Open it in a browser when the run is done.
    volumes:
      - ./target:/app/target
    restart: "no"
